name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify change risk
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
      modules: ${{ steps.risk.outputs.modules }}
      required_suites: ${{ steps.risk.outputs.required_suites }}
      required_hosts_json: ${{ steps.risk.outputs.required_hosts_json }}
      requires_windows_powershell: ${{ steps.risk.outputs.requires_windows_powershell }}
      run_validation_self_protection: ${{ steps.risk.outputs.run_validation_self_protection }}
      validation_self_protection_reason: ${{ steps.risk.outputs.validation_self_protection_reason }}
      base: ${{ steps.risk.outputs.base }}
      head: ${{ steps.risk.outputs.head }}
      run_heavy_targeted_regression: ${{ steps.risk.outputs.run_heavy_targeted_regression }}
      heavy_targeted_reason: ${{ steps.risk.outputs.heavy_targeted_reason }}
      validation_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve validation SHA
        id: target
        shell: pwsh
        run: |
          $sha = if ("${{ github.event_name }}" -eq "pull_request") {
            "${{ github.event.pull_request.head.sha }}"
          }
          else {
            "${{ github.sha }}"
          }
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Validation SHA must be a 40-character commit ID."
          }
          "sha=$($sha.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.sha }}

      - name: Classify change risk and test routing contract
        id: risk
        shell: pwsh
        run: |
          ./scripts/test-validate-change.ps1 -Json |
            Tee-Object -FilePath "$env:RUNNER_TEMP/change-routing-tests.json"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $result = ./scripts/validate-change.ps1 `
              -BaseRef "origin/${{ github.base_ref }}" `
              -HeadRef HEAD `
              -Json | ConvertFrom-Json
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $forcePush = [System.Convert]::ToBoolean("${{ github.event.forced }}")
            $result = ./scripts/validate-change.ps1 `
              -BaseRef "${{ github.event.before }}" `
              -HeadRef "${{ github.sha }}" `
              -ForcePush:$forcePush `
              -Json | ConvertFrom-Json
          }
          else {
            $result = ./scripts/validate-change.ps1 `
              -ChangedPath ".github/workflows/release-validation.yml" `
              -Json | ConvertFrom-Json
          }
          $result | ConvertTo-Json -Depth 8 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/change-classification.json"
          $result = ./scripts/validation/release-classifier-output-contract.ps1 -Result $result
          "tier=$($result.detected_tier)" >> $env:GITHUB_OUTPUT
          "modules=$(@($result.affected_modules) -join ',')" >> $env:GITHUB_OUTPUT
          "required_suites=$(@($result.required_suites) -join ',')" >> $env:GITHUB_OUTPUT
          "required_hosts_json=$(@($result.required_hosts) | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "requires_windows_powershell=$(([bool]$result.requires_windows_powershell).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "run_validation_self_protection=$(([bool]$result.run_validation_self_protection).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "validation_self_protection_reason=$($result.validation_self_protection_reason)" >> $env:GITHUB_OUTPUT
          "base=$($result.base_ref)" >> $env:GITHUB_OUTPUT
          "head=$($result.head_ref)" >> $env:GITHUB_OUTPUT
          "run_heavy_targeted_regression=$(([bool]$result.run_heavy_targeted_regression).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "heavy_targeted_reason=$($result.heavy_targeted_reason)" >> $env:GITHUB_OUTPUT

      - name: Upload classification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: change-risk-classification
          path: |
            ${{ runner.temp }}/change-routing-tests.json
            ${{ runner.temp }}/change-classification.json
          if-no-files-found: error

  quick-validation:
    name: quick validation
    needs: classify
    if: github.event_name == 'pull_request' && (needs.classify.outputs.tier == '0' || needs.classify.outputs.tier == '1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.validation_sha }}
      - name: Run quick checks
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-quick-validation"
          ./scripts/validate-targeted-change.ps1 `
            -BaseRef "${{ needs.classify.outputs.base }}" `
            -HeadRef "${{ needs.classify.outputs.head }}" `
            -Mode quick `
            -ScratchRoot $scratch `
            -Json | Tee-Object -FilePath (Join-Path $scratch "validation-output.json")
      - name: Write quick validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-quick-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ needs.classify.outputs.validation_sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -SuccessAllowlist @("targeted-validation-result.json", "evidence-manifest.json")
      - name: Upload quick validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: quick-validation
          path: |
            ${{ runner.temp }}/agent-ecosystem-quick-validation/targeted-validation-result.json
            ${{ runner.temp }}/agent-ecosystem-quick-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload quick validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quick-validation-failure
          path: ${{ runner.temp }}/agent-ecosystem-quick-validation
          if-no-files-found: error

  targeted-validation:
    name: affected validation (${{ matrix.os }})
    needs: classify
    if: always() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.tier == '2' || needs.classify.outputs.tier == '3')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.required_hosts_json || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.validation_sha }}
      - name: Run affected-module checks
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-targeted-validation"
          ./scripts/validate-targeted-change.ps1 `
            -BaseRef "${{ needs.classify.outputs.base }}" `
            -HeadRef "${{ needs.classify.outputs.head }}" `
             -Mode targeted `
             -ExecutionHost "${{ matrix.os }}" `
             -ScratchRoot $scratch `
            -Json | Tee-Object -FilePath (Join-Path $scratch "validation-output.json")
      - name: Write targeted validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-targeted-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ needs.classify.outputs.validation_sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -SuccessAllowlist @("targeted-validation-result.json", "evidence-manifest.json")
      - name: Upload targeted validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: affected-validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/agent-ecosystem-targeted-validation/targeted-validation-result.json
            ${{ runner.temp }}/agent-ecosystem-targeted-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload targeted validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: affected-validation-${{ matrix.os }}-failure
          path: ${{ runner.temp }}/agent-ecosystem-targeted-validation
          if-no-files-found: error

  validation-self-protection:
    name: validation self-protection
    needs: classify
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.classify.result != 'success' || needs.classify.outputs.run_validation_self_protection != 'false')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.validation_sha }}
      - name: Run independent validation mutation oracle
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-validation-self-protection"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          ./scripts/test-heavy-targeted-regression.ps1 -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-self-protection.json")
      - name: Upload self-protection success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-self-protection
          path: ${{ runner.temp }}/agent-ecosystem-validation-self-protection/validation-self-protection.json
          if-no-files-found: error
      - name: Upload self-protection failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-self-protection-failure
          path: ${{ runner.temp }}/agent-ecosystem-validation-self-protection
          if-no-files-found: error

  validate-platform-neutral:
    name: validate platform-neutral contracts
    needs: classify
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head or push commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.validation_sha }}

      - name: Run platform-neutral release contracts once
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-platform-neutral-validation"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $shard = if ("${{ github.event_name }}" -eq "push") { "PlatformNeutral" } else { "RepositoryCheckpointNeutral" }
          ./scripts/validate-release.ps1 `
            -ValidationShard $shard `
            -ScratchRoot $scratch `
            -Json | Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Write platform-neutral validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-platform-neutral-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ needs.classify.outputs.validation_sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -SuccessAllowlist @("validation-result.json", "evidence-manifest.json")
      - name: Upload platform-neutral validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-platform-neutral
          path: |
            ${{ runner.temp }}/agent-ecosystem-platform-neutral-validation/validation-result.json
            ${{ runner.temp }}/agent-ecosystem-platform-neutral-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload platform-neutral validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-platform-neutral-failure
          path: ${{ runner.temp }}/agent-ecosystem-platform-neutral-validation
          if-no-files-found: error

  validate:
    name: validate pwsh (${{ matrix.os }})
    needs: classify
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.validation_sha }}

      - name: Run release validator
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $shard = if ("${{ github.event_name }}" -eq "push") { "RuntimePlatform" } else { "RepositoryCheckpointRuntime" }
          ./scripts/validate-release.ps1 -ValidationShard $shard -ScratchRoot $scratch -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Write validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          $heavyStatus = "not-applicable"
          $heavyReason = "independent-self-protection-job"
          $successAllowlist = @("validation-result.json", "evidence-manifest.json")
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ needs.classify.outputs.validation_sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -HeavyTargetedStatus $heavyStatus `
            -HeavyTargetedReason $heavyReason `
            -SuccessAllowlist $successAllowlist
      - name: Upload validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-pwsh-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/agent-ecosystem-release-validation/validation-result.json
            ${{ runner.temp }}/agent-ecosystem-release-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-pwsh-${{ matrix.os }}-failure
          path: ${{ runner.temp }}/agent-ecosystem-release-validation
          if-no-files-found: error

  validate-windows-powershell:
    name: validate Windows PowerShell 5.1
    needs: classify
    if: always() && ((github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.requires_windows_powershell != 'false')) || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.validation_sha }}

      - name: Run affected Windows PowerShell suites
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-affected-validation-windows-powershell"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-targeted-change.ps1 `
            -BaseRef "${{ needs.classify.outputs.base }}" -HeadRef "${{ needs.classify.outputs.head }}" `
            -Mode targeted -ExecutionHost windows-powershell -ScratchRoot $scratch -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Run release validator
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation-windows-powershell"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $shard = if ("${{ github.event_name }}" -eq "push") { "RuntimePlatform" } else { "RepositoryCheckpointRuntime" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-release.ps1 -ValidationShard $shard -ScratchRoot $scratch -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Write validation evidence manifest
        if: always()
        shell: powershell
        run: |
          $scratch = if ("${{ github.event_name }}" -eq "pull_request") { Join-Path $env:RUNNER_TEMP "agent-ecosystem-affected-validation-windows-powershell" } else { Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation-windows-powershell" }
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          $heavyStatus = "not-applicable"
          $heavyReason = "independent-self-protection-job"
          $successAllowlist = if ("${{ github.event_name }}" -eq "pull_request") { @("targeted-validation-result.json", "evidence-manifest.json") } else { @("validation-result.json", "evidence-manifest.json") }
          .\scripts\validation\write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ needs.classify.outputs.validation_sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -HeavyTargetedStatus $heavyStatus `
            -HeavyTargetedReason $heavyReason `
            -SuccessAllowlist $successAllowlist
      - name: Upload validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-powershell
          path: |
            ${{ runner.temp }}/agent-ecosystem-affected-validation-windows-powershell/targeted-validation-result.json
            ${{ runner.temp }}/agent-ecosystem-affected-validation-windows-powershell/evidence-manifest.json
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell/validation-result.json
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell/evidence-manifest.json
          if-no-files-found: error
      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-powershell-failure
          path: |
            ${{ runner.temp }}/agent-ecosystem-affected-validation-windows-powershell
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell
          if-no-files-found: error

  validation-gate:
    name: validation gate
    if: always()
    needs:
      - classify
      - quick-validation
      - targeted-validation
      - validation-self-protection
      - validate-platform-neutral
      - validate
      - validate-windows-powershell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.classify.outputs.validation_sha }}

      - name: Evaluate required validation contract
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TIER: ${{ needs.classify.outputs.tier }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUICK_RESULT: ${{ needs.quick-validation.result }}
          TARGETED_RESULT: ${{ needs.targeted-validation.result }}
          SELF_PROTECTION_RESULT: ${{ needs.validation-self-protection.result }}
          SELF_PROTECTION_REQUIRED: ${{ needs.classify.outputs.run_validation_self_protection }}
          WINDOWS_POWERSHELL_REQUIRED: ${{ needs.classify.outputs.requires_windows_powershell }}
          PLATFORM_NEUTRAL_RESULT: ${{ needs.validate-platform-neutral.result }}
          PWSH_MATRIX_RESULT: ${{ needs.validate.result }}
          WINDOWS_POWERSHELL_RESULT: ${{ needs.validate-windows-powershell.result }}
        run: |
          ./scripts/validation/required-validation-gate.ps1 `
            -EventName $env:EVENT_NAME `
            -Tier $env:TIER `
            -ClassifyResult $env:CLASSIFY_RESULT `
            -QuickResult $env:QUICK_RESULT `
            -TargetedResult $env:TARGETED_RESULT `
            -SelfProtectionResult $env:SELF_PROTECTION_RESULT `
            -SelfProtectionRequired $env:SELF_PROTECTION_REQUIRED `
            -WindowsPowerShellRequired $env:WINDOWS_POWERSHELL_REQUIRED `
            -PlatformNeutralResult $env:PLATFORM_NEUTRAL_RESULT `
            -PwshMatrixResult $env:PWSH_MATRIX_RESULT `
            -WindowsPowerShellResult $env:WINDOWS_POWERSHELL_RESULT
