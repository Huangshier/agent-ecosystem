name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify change risk
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
      modules: ${{ steps.risk.outputs.modules }}
      base: ${{ steps.risk.outputs.base }}
      head: ${{ steps.risk.outputs.head }}
      run_heavy_targeted_regression: ${{ steps.risk.outputs.run_heavy_targeted_regression }}
      heavy_targeted_reason: ${{ steps.risk.outputs.heavy_targeted_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change risk and test routing contract
        id: risk
        shell: pwsh
        run: |
          ./scripts/test-validate-change.ps1 -Json |
            Tee-Object -FilePath "$env:RUNNER_TEMP/change-routing-tests.json"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $result = ./scripts/validate-change.ps1 `
              -BaseRef "origin/${{ github.base_ref }}" `
              -HeadRef HEAD `
              -Json | ConvertFrom-Json
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $forcePush = [System.Convert]::ToBoolean("${{ github.event.forced }}")
            $result = ./scripts/validate-change.ps1 `
              -BaseRef "${{ github.event.before }}" `
              -HeadRef "${{ github.sha }}" `
              -ForcePush:$forcePush `
              -Json | ConvertFrom-Json
          }
          else {
            $result = ./scripts/validate-change.ps1 `
              -ChangedPath ".github/workflows/release-validation.yml" `
              -Json | ConvertFrom-Json
          }
          $result | ConvertTo-Json -Depth 8 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/change-classification.json"
          $result = ./scripts/validation/release-classifier-output-contract.ps1 -Result $result
          "tier=$($result.detected_tier)" >> $env:GITHUB_OUTPUT
          "modules=$(@($result.affected_modules) -join ',')" >> $env:GITHUB_OUTPUT
          "base=$($result.base_ref)" >> $env:GITHUB_OUTPUT
          "head=$($result.head_ref)" >> $env:GITHUB_OUTPUT
          "run_heavy_targeted_regression=$(([bool]$result.run_heavy_targeted_regression).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "heavy_targeted_reason=$($result.heavy_targeted_reason)" >> $env:GITHUB_OUTPUT

      - name: Upload classification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: change-risk-classification
          path: |
            ${{ runner.temp }}/change-routing-tests.json
            ${{ runner.temp }}/change-classification.json
          if-no-files-found: error

  quick-validation:
    name: quick validation
    needs: classify
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.classify.outputs.tier == '0' || needs.classify.outputs.tier == '1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run quick checks
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-quick-validation"
          ./scripts/validate-targeted-change.ps1 `
            -BaseRef "${{ needs.classify.outputs.base }}" `
            -HeadRef "${{ needs.classify.outputs.head }}" `
            -Mode quick `
            -ScratchRoot $scratch `
            -Json | Tee-Object -FilePath (Join-Path $scratch "validation-output.json")
      - name: Write quick validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-quick-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -SuccessAllowlist @("targeted-validation-result.json", "evidence-manifest.json")
      - name: Upload quick validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: quick-validation
          path: |
            ${{ runner.temp }}/agent-ecosystem-quick-validation/targeted-validation-result.json
            ${{ runner.temp }}/agent-ecosystem-quick-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload quick validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quick-validation-failure
          path: ${{ runner.temp }}/agent-ecosystem-quick-validation
          if-no-files-found: error

  targeted-validation:
    name: targeted Tier 2 (${{ matrix.os }})
    needs: classify
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.classify.outputs.tier == '2'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run affected-module checks
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-targeted-validation"
          ./scripts/validate-targeted-change.ps1 `
            -BaseRef "${{ needs.classify.outputs.base }}" `
            -HeadRef "${{ needs.classify.outputs.head }}" `
            -Mode targeted `
            -ScratchRoot $scratch `
            -Json | Tee-Object -FilePath (Join-Path $scratch "validation-output.json")
      - name: Write targeted validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-targeted-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -SuccessAllowlist @("targeted-validation-result.json", "evidence-manifest.json")
      - name: Upload targeted validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/agent-ecosystem-targeted-validation/targeted-validation-result.json
            ${{ runner.temp }}/agent-ecosystem-targeted-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload targeted validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-validation-${{ matrix.os }}-failure
          path: ${{ runner.temp }}/agent-ecosystem-targeted-validation
          if-no-files-found: error

  validate:
    name: validate pwsh (${{ matrix.os }})
    needs: classify
    if: always() && (github.event_name == 'workflow_dispatch' || needs.classify.result != 'success' || needs.classify.outputs.tier == '3')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Tier 3 targeted routing regressions
        if: (needs.classify.result != 'success' || (needs.classify.outputs.tier == '3' && needs.classify.outputs.run_heavy_targeted_regression != 'false')) && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          ./scripts/test-validate-change.ps1 -RunTargetedRegression -Json -OutputPath `
            (Join-Path $scratch "change-routing-tests.json")

      - name: Run release validator
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          ./scripts/validate-release.ps1 -ScratchRoot $scratch -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Write validation evidence manifest
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          $isWindowsJob = "${{ matrix.os }}" -eq "windows-latest"
          $heavyStatus = "not-applicable"
          $heavyReason = "non-windows-full-job"
          if ($isWindowsJob) {
            $heavyStatus = if ("${{ needs.classify.result }}" -ne "success" -or "${{ needs.classify.outputs.run_heavy_targeted_regression }}" -ne "false") { "executed" } else { "skipped" }
            $heavyReason = if ("${{ needs.classify.result }}" -ne "success") { "classifier-failure" } else { "${{ needs.classify.outputs.heavy_targeted_reason }}" }
          }
          $successAllowlist = @("validation-result.json", "evidence-manifest.json")
          if (Test-Path -LiteralPath (Join-Path $scratch "change-routing-tests.json")) {
            $successAllowlist = @("change-routing-tests.json") + $successAllowlist
          }
          ./scripts/validation/write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -HeavyTargetedStatus $heavyStatus `
            -HeavyTargetedReason $heavyReason `
            -SuccessAllowlist $successAllowlist
      - name: Upload validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-pwsh-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/agent-ecosystem-release-validation/change-routing-tests.json
            ${{ runner.temp }}/agent-ecosystem-release-validation/validation-result.json
            ${{ runner.temp }}/agent-ecosystem-release-validation/evidence-manifest.json
          if-no-files-found: error
      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-pwsh-${{ matrix.os }}-failure
          path: ${{ runner.temp }}/agent-ecosystem-release-validation
          if-no-files-found: error

  validate-windows-powershell:
    name: validate Windows PowerShell 5.1
    needs: classify
    if: always() && (github.event_name == 'workflow_dispatch' || needs.classify.result != 'success' || needs.classify.outputs.tier == '3')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Tier 3 targeted routing regressions
        if: needs.classify.result != 'success' || (needs.classify.outputs.tier == '3' && needs.classify.outputs.run_heavy_targeted_regression != 'false')
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation-windows-powershell"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-validate-change.ps1 -RunTargetedRegression `
            -Json -OutputPath (Join-Path $scratch "change-routing-tests.json")

      - name: Run release validator
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation-windows-powershell"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-release.ps1 -ScratchRoot $scratch -Json |
            Tee-Object -FilePath (Join-Path $scratch "validation-output.json")

      - name: Write validation evidence manifest
        if: always()
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "agent-ecosystem-release-validation-windows-powershell"
          $outcome = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $hostIdentity = "${{ runner.os }}-$($PSVersionTable.PSEdition)-$($PSVersionTable.PSVersion)"
          $heavyStatus = if ("${{ needs.classify.result }}" -ne "success" -or "${{ needs.classify.outputs.run_heavy_targeted_regression }}" -ne "false") { "executed" } else { "skipped" }
          $heavyReason = if ("${{ needs.classify.result }}" -ne "success") { "classifier-failure" } else { "${{ needs.classify.outputs.heavy_targeted_reason }}" }
          $successAllowlist = @("validation-result.json", "evidence-manifest.json")
          if (Test-Path -LiteralPath (Join-Path $scratch "change-routing-tests.json")) {
            $successAllowlist = @("change-routing-tests.json") + $successAllowlist
          }
          .\scripts\validation\write-evidence-manifest.ps1 `
            -ScratchRoot $scratch `
            -Outcome $outcome `
            -CommitSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}" `
            -RunAttempt "${{ github.run_attempt }}" `
            -JobName "${{ github.job }}" `
            -HostIdentity $hostIdentity `
            -HeavyTargetedStatus $heavyStatus `
            -HeavyTargetedReason $heavyReason `
            -SuccessAllowlist $successAllowlist
      - name: Upload validation success evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-powershell
          path: |
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell/change-routing-tests.json
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell/validation-result.json
            ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell/evidence-manifest.json
          if-no-files-found: error
      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-powershell-failure
          path: ${{ runner.temp }}/agent-ecosystem-release-validation-windows-powershell
          if-no-files-found: error

  validation-gate:
    name: validation gate
    if: always()
    needs:
      - classify
      - quick-validation
      - targeted-validation
      - validate
      - validate-windows-powershell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Evaluate required validation contract
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TIER: ${{ needs.classify.outputs.tier }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUICK_RESULT: ${{ needs.quick-validation.result }}
          TARGETED_RESULT: ${{ needs.targeted-validation.result }}
          FULL_PWSH_RESULT: ${{ needs.validate.result }}
          WINDOWS_POWERSHELL_RESULT: ${{ needs.validate-windows-powershell.result }}
        run: |
          ./scripts/validation/required-validation-gate.ps1 `
            -EventName $env:EVENT_NAME `
            -Tier $env:TIER `
            -ClassifyResult $env:CLASSIFY_RESULT `
            -QuickResult $env:QUICK_RESULT `
            -TargetedResult $env:TARGETED_RESULT `
            -FullPwshResult $env:FULL_PWSH_RESULT `
            -WindowsPowerShellResult $env:WINDOWS_POWERSHELL_RESULT
